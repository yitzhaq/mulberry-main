name: "SonarCloud"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '43 3 * * 3'

jobs:
  sonarcloud:
    name: Analyze (C/C++)
    runs-on: ubuntu-latest
    env:
      BUILD_WRAPPER_OUT_DIR: bw-output

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential autoconf \
          libaspell-dev libbrotli-dev libfl-dev libfontconfig-dev \
          libfreetype-dev libglib2.0-dev libkrb5-dev libldap-dev \
          libpcre3-dev libsodium-dev libssl-dev libunistring-dev libxml2-dev \
          libx11-dev libxext-dev libxft-dev libxpm-dev libzstd-dev \
          pkg-config python3 unicode-cldr-core zlib1g-dev

    - name: Install build wrapper
      uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v7

    - name: Configure
      run: |
        autoconf
        ./configure

    - name: Build with build wrapper
      run: |
        build-wrapper-linux-x86-64 --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} make -j$(nproc)

    - name: Normalize compilation database paths
      run: |
        python3 -c "
        import json, os
        db = json.load(open('${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json'))
        changed = 0
        for entry in db:
            d = entry.get('directory', '')
            f = entry.get('file', '')
            resolved = os.path.normpath(os.path.join(d, f))
            if resolved != f:
                changed += 1
                entry['file'] = resolved
            if d:
                entry['directory'] = os.path.normpath(d)
        json.dump(db, open('${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json', 'w'), indent=2)
        print(f'Normalized {len(db)} entries ({changed} paths resolved)')
        "

    - name: SonarCloud scan
      uses: SonarSource/sonarqube-scan-action@v7
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        skipSignatureVerification: false
        args: >
          --define sonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json
