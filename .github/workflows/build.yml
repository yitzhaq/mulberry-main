name: "Build & Analyze"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ============================================================
  # Compilability check + shared compilation database for SAST
  # ============================================================
  build:
    name: Build + Compilation Database
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bear \
          build-essential autoconf \
          libaspell-dev libbrotli-dev libfl-dev libfontconfig-dev \
          libfreetype-dev libglib2.0-dev libkrb5-dev libldap-dev \
          libpcre3-dev libsodium-dev libssl-dev libunistring-dev libxml2-dev \
          libx11-dev libxext-dev libxft-dev libxpm-dev libzstd-dev \
          pkg-config python3 unicode-cldr-core zlib1g-dev

    - name: Configure
      run: |
        autoconf
        ./configure

    - name: Build and generate compilation database
      run: bear -- make -j$(nproc)

    - name: Upload compilation database
      uses: actions/upload-artifact@v7
      with:
        name: compilation-database
        path: compile_commands.json

  # ============================================================
  # CodeChecker: Clang SA + Clang-Tidy + cppcheck + GCC -fanalyzer + Infer
  # ============================================================
  codechecker:
    name: Static Analysis (CodeChecker)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cppcheck \
          libaspell-dev libbrotli-dev libfl-dev libfontconfig-dev \
          libfreetype-dev libglib2.0-dev libkrb5-dev libldap-dev \
          libpcre3-dev libsodium-dev libssl-dev libunistring-dev libxml2-dev \
          libx11-dev libxext-dev libxft-dev libxpm-dev libzstd-dev

    - name: Download compilation database
      uses: actions/download-artifact@v8
      with:
        name: compilation-database

    - name: Create header symlinks required for analysis
      run: |
        echo "=== Creating Mulberry header symlinks ==="
        mkdir -p Linux/Includes
        cd Linux && bash links.sh
        symcount=$(ls Includes/ | wc -l)
        echo "Created $symcount symlinks in Linux/Includes/"
        ls Includes/ | head -10
        echo "---"
        echo "Checking specific headers via symlinks:"
        ls -la Includes/CMulberryApp.h 2>&1 || echo "MISSING: CMulberryApp.h"
        ls -la Includes/CEmojiTable.h 2>&1 || echo "MISSING: CEmojiTable.h"
        echo "Symlink target resolution:"
        readlink -f Includes/CMulberryApp.h 2>&1 || echo "BROKEN: CMulberryApp.h"
        readlink -f Includes/CEmojiTable.h 2>&1 || echo "BROKEN: CEmojiTable.h"
        cd ..

        echo "=== Creating JX/ACE config symlinks ==="
        ln -sf config-linux.h Libraries/JX/ACE/ACE_wrappers/ace/config.h
        ln -sf ../include/make/sys/Linux-Intel-x86_64-gcc3 Libraries/JX/include/make/jx_config
        ls -la Libraries/JX/ACE/ACE_wrappers/ace/config.h
        readlink -f Libraries/JX/ACE/ACE_wrappers/ace/config.h

        echo "=== JX include directories ==="
        echo "Libraries/JX/include/:"
        ls Libraries/JX/include/ 2>&1 || echo "MISSING: Libraries/JX/include/"
        echo "---"
        echo "Libraries/JX/include/jx/ (first 20):"
        ls Libraries/JX/include/jx/ 2>/dev/null | head -20 || echo "MISSING or EMPTY"
        echo "Total: $(ls Libraries/JX/include/jx/ 2>/dev/null | wc -l) entries"
        echo "---"
        echo "Libraries/JX/include/jcore/ (first 20):"
        ls Libraries/JX/include/jcore/ 2>/dev/null | head -20 || echo "MISSING or EMPTY"
        echo "Total: $(ls Libraries/JX/include/jcore/ 2>/dev/null | wc -l) entries"
        echo "---"
        echo "Libraries/JX/ACE/ACE_wrappers/ace/ (first 10):"
        ls Libraries/JX/ACE/ACE_wrappers/ace/ 2>/dev/null | head -10 || echo "MISSING or EMPTY"

        echo "=== Checking compilation database paths ==="
        python3 -c "
        import json, os
        db = json.load(open('compile_commands.json'))
        entry = next(e for e in db if 'CRemotePrefsSets' in e.get('file', ''))
        d = entry['directory']
        print(f'directory field: {d}')
        print(f'directory exists: {os.path.isdir(d)}')
        args = entry.get('arguments', [])
        for a in args:
            if a.startswith('-I'):
                path = a[2:]
                if not os.path.isabs(path):
                    path = os.path.join(d, path)
                exists = os.path.isdir(path)
                if 'JX' in a or 'Includes' in a or not exists:
                    print(f'  {a} -> {path} (exists={exists})')
        "

        echo "=== Clang default search paths ==="
        /usr/lib/llvm-*/bin/clang -v -x c++ /dev/null -fsyntax-only 2>&1 | grep -A20 '#include.*search' || echo "Could not determine Clang search paths"

        echo "=== Test: can Clang find JX headers with our -I paths? ==="
        echo '#include <JXApplication.h>' > /tmp/test_include.cpp
        /usr/lib/llvm-*/bin/clang -fsyntax-only -x c++ \
          -I${{ github.workspace }}/Libraries/JX/include/jx \
          -I${{ github.workspace }}/Libraries/JX/include/jcore \
          -I${{ github.workspace }}/Libraries/JX/ACE/ACE_wrappers \
          /tmp/test_include.cpp 2>&1 | head -5 || echo "Test compile exited $?"

        echo "=== Mulberry_Prefix.h includes ==="
        head -30 Linux/Sources/Mulberry_Prefix.h 2>&1 || echo "MISSING"

        echo "=== Autoconf-generated files ==="
        ls -la config.h config.status Makefile 2>&1 || echo "No autoconf outputs (expected)"
        ls -la Linux/Makefile 2>&1 || echo "No Linux/Makefile (expected)"

        echo "=== Symlink integrity check ==="
        broken=$(find Linux/Includes/ -type l ! -exec test -e {} \; -print 2>/dev/null | wc -l)
        total=$(find Linux/Includes/ -type l 2>/dev/null | wc -l)
        echo "Linux/Includes/: $total symlinks, $broken broken"
        if [ "$broken" -gt 0 ]; then
          echo "First 10 broken symlinks:"
          find Linux/Includes/ -type l ! -exec test -e {} \; -print 2>/dev/null | head -10
        fi

        echo "=== Working directory ==="
        pwd

    - name: Filter compilation database to exclude third-party libraries
      run: |
        python3 -c "
        import json
        EXCLUDE = ['/Libraries/JX/', '/Libraries/vendor/']
        db = json.load(open('compile_commands.json'))
        filtered = [e for e in db if not any(x in e.get('file', '') for x in EXCLUDE)]
        json.dump(filtered, open('compile_commands.json', 'w'), indent=2)
        print(f'Filtered: {len(db)} -> {len(filtered)} entries (removed {len(db)-len(filtered)} third-party entries)')
        "

    - name: Run CodeChecker analysis
      uses: whisperity/codechecker-analysis-action@v1
      id: codechecker
      with:
        config: ${{ github.workspace }}/.codechecker/config.json
        logfile: ${{ github.workspace }}/compile_commands.json
        ctu: true
        llvm-version: latest
        ignore-analyze-crashes: true

    - name: Convert results to SARIF
      if: always()
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        codechecker parse \
          ${{ steps.codechecker.outputs.analyze-output }} \
          --export sarif \
          --output ${{ github.workspace }}/codechecker.sarif \
          || true

    - name: Upload SARIF to GitHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: codechecker.sarif
        category: codechecker
      continue-on-error: true

    - name: Upload HTML reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: codechecker-reports
        path: ${{ steps.codechecker.outputs.result-html-dir }}
        if-no-files-found: ignore

  # ============================================================
  # PVS-Studio: deep C++ logic analysis (FOSS license)
  # ============================================================
  pvs-studio:
    name: Static Analysis (PVS-Studio)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write

    steps:
    - name: Check for credentials
      id: check-creds
      run: |
        if [ -z "${{ secrets.PVS_STUDIO_CREDENTIALS }}" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "::notice::PVS-Studio skipped — PVS_STUDIO_CREDENTIALS secret not set"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout repository
      if: steps.check-creds.outputs.skip != 'true'
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      if: steps.check-creds.outputs.skip != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libaspell-dev libbrotli-dev libfl-dev libfontconfig-dev \
          libfreetype-dev libglib2.0-dev libkrb5-dev libldap-dev \
          libpcre3-dev libsodium-dev libssl-dev libunistring-dev libxml2-dev \
          libx11-dev libxext-dev libxft-dev libxpm-dev libzstd-dev

    - name: Install PVS-Studio
      if: steps.check-creds.outputs.skip != 'true'
      run: |
        wget -q -O - https://files.pvs-studio.com/etc/pubkey.txt \
          | sudo apt-key add -
        sudo wget -O /etc/apt/sources.list.d/viva64.list \
          https://files.pvs-studio.com/etc/viva64.list
        sudo apt-get update
        sudo apt-get install -y pvs-studio
        pvs-studio-analyzer credentials ${{ secrets.PVS_STUDIO_CREDENTIALS }}

    - name: Download compilation database
      if: steps.check-creds.outputs.skip != 'true'
      uses: actions/download-artifact@v8
      with:
        name: compilation-database

    - name: Run PVS-Studio analysis
      if: steps.check-creds.outputs.skip != 'true'
      run: pvs-studio-analyzer analyze -f compile_commands.json -j

    - name: Convert results to SARIF
      if: steps.check-creds.outputs.skip != 'true'
      run: |
        plog-converter PVS-Studio.log \
          -t json -n relative -R toRelative -r "$PWD"
        plog-converter relative.json \
          -t sarif -n pvs-report -r file://

    - name: Upload SARIF to GitHub Security
      if: steps.check-creds.outputs.skip != 'true'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: pvs-report.sarif
        category: PVS-Studio
      continue-on-error: true

  # ============================================================
  # SonarCloud: technical debt and quality tracking
  # ============================================================
  sonarcloud:
    name: Analyze (SonarCloud)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Download compilation database
      uses: actions/download-artifact@v8
      with:
        name: compilation-database

    - name: Normalize compilation database paths
      run: |
        python3 -c "
        import json, os
        db = json.load(open('compile_commands.json'))
        changed = 0
        for entry in db:
            d = entry.get('directory', '')
            f = entry.get('file', '')
            resolved = os.path.normpath(os.path.join(d, f))
            if resolved != f:
                changed += 1
                entry['file'] = resolved
            if d:
                entry['directory'] = os.path.normpath(d)
        json.dump(db, open('compile_commands.json', 'w'), indent=2)
        print(f'Normalized {len(db)} entries ({changed} paths resolved)')
        "

    - name: SonarCloud scan
      uses: SonarSource/sonarqube-scan-action@v8
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          --define sonar.cfamily.compile-commands=compile_commands.json

  # ============================================================
  # OSV-Scanner: dependency CVE scanning (git submodules)
  # ============================================================
  osv-scanner:
    name: Dependency CVE Scan (OSV)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: "-r ./ --allow-no-lockfiles"
      checkout-submodules: true
      fail-on-vuln: false
