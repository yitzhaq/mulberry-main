name: "Build & Analyze"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ============================================================
  # Compilability check + shared compilation database for SAST
  # ============================================================
  build:
    name: Build + Compilation Database
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bear \
          build-essential autoconf \
          libaspell-dev libbrotli-dev libfl-dev libfontconfig-dev \
          libfreetype-dev libglib2.0-dev libkrb5-dev libldap-dev \
          libpcre3-dev libsodium-dev libssl-dev libunistring-dev libxml2-dev \
          libx11-dev libxext-dev libxft-dev libxpm-dev libzstd-dev \
          pkg-config python3 unicode-cldr-core zlib1g-dev

    - name: Configure
      run: |
        autoconf
        ./configure

    - name: Build and generate compilation database
      run: bear -- make -j$(nproc)

    - name: Upload compilation database
      uses: actions/upload-artifact@v7
      with:
        name: compilation-database
        path: compile_commands.json

  # ============================================================
  # CodeChecker: Clang SA + Clang-Tidy + cppcheck + GCC -fanalyzer + Infer
  # ============================================================
  codechecker:
    name: Static Analysis (CodeChecker)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cppcheck python3 unicode-cldr-core \
          libaspell-dev libbrotli-dev libfl-dev libfontconfig-dev \
          libfreetype-dev libglib2.0-dev libkrb5-dev libldap-dev \
          libpcre3-dev libsodium-dev libssl-dev libunistring-dev libxml2-dev \
          libx11-dev libxext-dev libxft-dev libxpm-dev libzstd-dev

    - name: Install Infer
      run: |
        INFER_VERSION=$(curl -sL https://api.github.com/repos/facebook/infer/releases/latest \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
        echo "Installing Infer ${INFER_VERSION}"
        curl -sL "https://github.com/facebook/infer/releases/download/${INFER_VERSION}/infer-linux-x86_64-${INFER_VERSION}.tar.xz" \
          | sudo tar xJ -C /opt
        sudo mv "/opt/infer-linux-x86_64-${INFER_VERSION}" /opt/infer
        sudo ln -sf /opt/infer/bin/infer /usr/local/bin/infer
        infer --version

    - name: Download compilation database
      uses: actions/download-artifact@v8
      with:
        name: compilation-database

    - name: Generate build artifacts required for analysis
      run: |
        # Emoji table (generated from CLDR data at build time, gitignored)
        python3 scripts/generate-emoji-table.py \
          Sources_Common/i18n/Charsets/CEmojiTable.h \
          /usr/share/unicode/cldr/common/annotations/en.xml \
          /usr/share/unicode/cldr/common/annotationsDerived/en.xml

        # Mulberry header symlinks (same as build process)
        mkdir -p Linux/Includes
        cd Linux && bash links.sh && cd ..

        # JX include dirs (populated by JX build, not tracked in git)
        mkdir -p Libraries/JX/include/jx Libraries/JX/include/jcore Libraries/JX/include/jximage
        for f in Libraries/JX/libjx/code/*; do
          ln -sf "../../libjx/code/$(basename "$f")" "Libraries/JX/include/jx/$(basename "$f")"
        done
        for f in Libraries/JX/libjcore/code/*; do
          ln -sf "../../libjcore/code/$(basename "$f")" "Libraries/JX/include/jcore/$(basename "$f")"
        done
        for f in Libraries/JX/libjx/image/*; do
          ln -sf "../../libjx/image/$(basename "$f")" "Libraries/JX/include/jximage/$(basename "$f")"
        done

        # JX/ACE config symlinks (created by configure)
        ln -sf config-linux.h Libraries/JX/ACE/ACE_wrappers/ace/config.h
        ln -sf ../include/make/sys/Linux-Intel-x86_64-gcc3 Libraries/JX/include/make/jx_config

        # Fix CodeChecker report hash path resolution — it strips directory
        # components from the workspace path, looking for prefix headers at
        # wrong relative paths. Create symlinks at all resolved locations.
        sudo mkdir -p /home/runner/work/mulberry-main/Common
        sudo ln -sf ${{ github.workspace }}/Plug-ins/Common/Mac2Linux.h /home/runner/work/mulberry-main/Common/Mac2Linux.h
        sudo ln -sf ${{ github.workspace }}/Plug-ins/Common/Plugin_Prefix_Linux.h /home/runner/work/mulberry-main/Common/Plugin_Prefix_Linux.h
        sudo ln -sf ${{ github.workspace }}/Plug-ins/Common/os_dep.h /home/runner/work/mulberry-main/Common/os_dep.h
        sudo mkdir -p /home/runner/work/Linux/Sources
        sudo ln -sf ${{ github.workspace }}/Linux/Sources/Mulberry_Prefix.h /home/runner/work/Linux/Sources/Mulberry_Prefix.h
        ln -sf Linux/Sources Sources

        echo "Symlinks: $(find Linux/Includes -type l | wc -l) Mulberry, $(ls Libraries/JX/include/jx/*.h | wc -l) jx, $(ls Libraries/JX/include/jcore/*.h | wc -l) jcore"

    - name: Filter compilation database to exclude third-party libraries
      run: |
        python3 -c "
        import json
        EXCLUDE = ['/Libraries/JX/', '/Libraries/vendor/', '/Libraries/vzic/', '/Libraries/include/', '/Libraries/openssl/']
        db = json.load(open('compile_commands.json'))
        filtered = [e for e in db if not any(x in e.get('file', '') for x in EXCLUDE)]
        json.dump(filtered, open('compile_commands.json', 'w'), indent=2)
        print(f'Filtered: {len(db)} -> {len(filtered)} entries (removed {len(db)-len(filtered)} third-party entries)')
        "

    - name: Run CodeChecker analysis
      uses: whisperity/codechecker-analysis-action@v1
      id: codechecker
      with:
        config: ${{ github.workspace }}/.codechecker/config.json
        logfile: ${{ github.workspace }}/compile_commands.json
        ctu: true
        llvm-version: latest
        ignore-analyze-crashes: true

    - name: Convert results to SARIF
      if: always()
      run: |
        echo "=========================================="
        echo "=== FULL CODECHECKER BINARY DIAGNOSTIC ==="
        echo "=========================================="

        echo "=== 1. Environment ==="
        echo "USER: $(whoami)"
        echo "HOME: $HOME"
        echo "PWD: $(pwd)"
        echo "PATH: $PATH"
        echo "PYTHONPATH: ${PYTHONPATH:-unset}"
        echo "VIRTUAL_ENV: ${VIRTUAL_ENV:-unset}"
        python3 --version
        pip --version

        echo "=== 2. Current state of ~/.local/bin ==="
        echo "Directory exists: $(test -d ~/.local/bin && echo yes || echo no)"
        echo "Full listing:"
        ls -la ~/.local/bin/ 2>&1 | head -30
        echo "Total files: $(ls ~/.local/bin/ 2>/dev/null | wc -l)"

        echo "=== 3. Search for codechecker binary EVERYWHERE ==="
        echo "which codechecker: $(which codechecker 2>&1)"
        echo "type codechecker: $(type codechecker 2>&1)"
        echo "command -v codechecker: $(command -v codechecker 2>&1)"
        echo "find in ~/.local:"
        find ~/.local -iname '*codechecker*' -ls 2>/dev/null || echo "nothing"
        echo "find in /home/runner:"
        find /home/runner -maxdepth 4 -iname '*codechecker*' -not -path '*/work/*' -ls 2>/dev/null || echo "nothing"
        echo "find in /usr/local:"
        find /usr/local -iname '*codechecker*' -ls 2>/dev/null || echo "nothing"
        echo "find in /usr:"
        find /usr -maxdepth 4 -iname '*codechecker*' -ls 2>/dev/null || echo "nothing"

        echo "=== 4. pip package state ==="
        echo "pip show codechecker:"
        pip show codechecker 2>&1
        echo "---"
        echo "pip show --files codechecker:"
        pip show --files codechecker 2>&1
        echo "---"
        echo "pip list | grep -i codechecker:"
        pip list 2>&1 | grep -i codechecker
        echo "---"
        echo "Entry points file:"
        find ~/.local -path '*/codechecker*dist-info/entry_points.txt' -exec echo "Found: {}" \; -exec cat {} \; 2>/dev/null || echo "no entry_points.txt found"
        echo "---"
        echo "RECORD file (installed files list):"
        find ~/.local -path '*/codechecker*dist-info/RECORD' -exec echo "Found: {}" \; -exec grep -i 'bin/' {} \; 2>/dev/null || echo "no RECORD found"
        echo "---"
        echo "top_level.txt:"
        find ~/.local -path '*/codechecker*dist-info/top_level.txt' -exec echo "Found: {}" \; -exec cat {} \; 2>/dev/null || echo "not found"

        echo "=== 5. Attempt reinstall ==="
        echo "pip install --force-reinstall --no-deps codechecker:"
        pip install --force-reinstall --no-deps codechecker 2>&1
        echo "Exit code: $?"
        echo "---"
        echo "After reinstall - which: $(which codechecker 2>&1)"
        echo "After reinstall - ls ~/.local/bin/codechecker: $(ls -la ~/.local/bin/codechecker 2>&1)"
        echo "After reinstall - ~/.local/bin listing:"
        ls -la ~/.local/bin/ 2>&1 | head -30

        echo "=== 6. Try alternative invocations ==="
        echo "python3 -m codechecker_cmd:"
        python3 -c "import codechecker; print('codechecker module path:', codechecker.__file__)" 2>&1 || echo "can't import codechecker"
        echo "---"
        echo "python3 -m codechecker_cmd.cmd:"
        python3 -c "from codechecker_cmd import cmd; print('cmd module found')" 2>&1 || echo "can't import codechecker_cmd"
        echo "---"
        echo "Looking for CodeChecker main entry:"
        find ~/.local -name 'cmd.py' -path '*codechecker*' -ls 2>/dev/null || echo "not found"
        find ~/.local -name '__main__.py' -path '*codechecker*' -ls 2>/dev/null || echo "not found"
        echo "---"
        echo "All codechecker Python packages installed:"
        pip list 2>&1 | grep -i code

        echo "=== 7. Analyze output directory state ==="
        echo "analyze-output variable: ${{ steps.codechecker.outputs.analyze-output }}"
        echo "Directory exists: $(test -d '${{ steps.codechecker.outputs.analyze-output }}' && echo yes || echo no)"
        ls -la "${{ steps.codechecker.outputs.analyze-output }}/" 2>&1 | head -10
        echo "Plist files: $(find '${{ steps.codechecker.outputs.analyze-output }}' -name '*.plist' 2>/dev/null | wc -l)"
        echo "Total size: $(du -sh '${{ steps.codechecker.outputs.analyze-output }}' 2>/dev/null | cut -f1)"

        echo "=== 8. CODECHECKER_PATH env from action ==="
        echo "CODECHECKER_PATH: ${CODECHECKER_PATH:-unset}"
        if [ -n "${CODECHECKER_PATH}" ]; then
          echo "Contents of CODECHECKER_PATH dir:"
          ls -la "${CODECHECKER_PATH}/" 2>&1
        fi

        echo "=== 9. Attempt parse with every method ==="
        PARSED=false

        if command -v codechecker >/dev/null 2>&1; then
          echo "METHOD 1: codechecker in PATH"
          codechecker parse \
            ${{ steps.codechecker.outputs.analyze-output }} \
            --export sarif \
            --output ${{ github.workspace }}/codechecker.sarif 2>&1 && PARSED=true
        else
          echo "METHOD 1: SKIP (not in PATH)"
        fi

        if [ "$PARSED" = false ] && [ -x "$HOME/.local/bin/codechecker" ]; then
          echo "METHOD 2: direct path ~/.local/bin/codechecker"
          "$HOME/.local/bin/codechecker" parse \
            ${{ steps.codechecker.outputs.analyze-output }} \
            --export sarif \
            --output ${{ github.workspace }}/codechecker.sarif 2>&1 && PARSED=true
        else
          echo "METHOD 2: SKIP (not at ~/.local/bin/codechecker)"
        fi

        if [ "$PARSED" = false ]; then
          echo "METHOD 3: python3 -m codechecker_cmd.cli parse"
          python3 -m codechecker_cmd.cli parse \
            ${{ steps.codechecker.outputs.analyze-output }} \
            --export sarif \
            --output ${{ github.workspace }}/codechecker.sarif 2>&1 && PARSED=true || echo "METHOD 3 FAILED: $?"
        fi

        if [ "$PARSED" = false ]; then
          echo "METHOD 4: find any codechecker executable and try it"
          CC=$(find /home/runner -name 'CodeChecker' -o -name 'codechecker' 2>/dev/null | grep -v __pycache__ | grep -v '.pyc' | head -1)
          if [ -n "$CC" ]; then
            echo "Found: $CC"
            file "$CC"
            "$CC" parse \
              ${{ steps.codechecker.outputs.analyze-output }} \
              --export sarif \
              --output ${{ github.workspace }}/codechecker.sarif 2>&1 && PARSED=true || echo "METHOD 4 FAILED: $?"
          else
            echo "METHOD 4: SKIP (no executable found)"
          fi
        fi

        if [ "$PARSED" = false ]; then
          echo "::error::ALL METHODS FAILED — codechecker parse could not be executed"
        else
          echo "SUCCESS: codechecker.sarif generated"
          ls -la ${{ github.workspace }}/codechecker.sarif
          echo "File size: $(wc -c < ${{ github.workspace }}/codechecker.sarif) bytes"
          echo "Result count: $(python3 -c "import json; d=json.load(open('${{ github.workspace }}/codechecker.sarif')); print(len(d['runs'][0]['results']))" 2>&1)"
        fi

    - name: Upload SARIF to GitHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: codechecker.sarif
        category: codechecker
      continue-on-error: true

    - name: Upload HTML reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: codechecker-reports
        path: ${{ steps.codechecker.outputs.result-html-dir }}
        if-no-files-found: ignore

    - name: Upload raw analysis results (backup)
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: codechecker-raw-results
        path: ${{ steps.codechecker.outputs.analyze-output }}
        if-no-files-found: ignore

  # ============================================================
  # PVS-Studio: deep C++ logic analysis (FOSS license)
  # ============================================================
  pvs-studio:
    name: Static Analysis (PVS-Studio)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write

    steps:
    - name: Check for credentials
      id: check-creds
      run: |
        if [ -z "${{ secrets.PVS_STUDIO_CREDENTIALS }}" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "::notice::PVS-Studio skipped — PVS_STUDIO_CREDENTIALS secret not set"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout repository
      if: steps.check-creds.outputs.skip != 'true'
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      if: steps.check-creds.outputs.skip != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3 unicode-cldr-core \
          libaspell-dev libbrotli-dev libfl-dev libfontconfig-dev \
          libfreetype-dev libglib2.0-dev libkrb5-dev libldap-dev \
          libpcre3-dev libsodium-dev libssl-dev libunistring-dev libxml2-dev \
          libx11-dev libxext-dev libxft-dev libxpm-dev libzstd-dev

    - name: Install PVS-Studio
      if: steps.check-creds.outputs.skip != 'true'
      run: |
        wget -q -O - https://files.pvs-studio.com/etc/pubkey.txt \
          | sudo apt-key add -
        sudo wget -O /etc/apt/sources.list.d/viva64.list \
          https://files.pvs-studio.com/etc/viva64.list
        sudo apt-get update
        sudo apt-get install -y pvs-studio
        pvs-studio-analyzer credentials ${{ secrets.PVS_STUDIO_CREDENTIALS }}

    - name: Download compilation database
      if: steps.check-creds.outputs.skip != 'true'
      uses: actions/download-artifact@v8
      with:
        name: compilation-database

    - name: Generate build artifacts required for analysis
      if: steps.check-creds.outputs.skip != 'true'
      run: |
        python3 scripts/generate-emoji-table.py \
          Sources_Common/i18n/Charsets/CEmojiTable.h \
          /usr/share/unicode/cldr/common/annotations/en.xml \
          /usr/share/unicode/cldr/common/annotationsDerived/en.xml
        mkdir -p Linux/Includes
        cd Linux && bash links.sh && cd ..
        mkdir -p Libraries/JX/include/jx Libraries/JX/include/jcore Libraries/JX/include/jximage
        for f in Libraries/JX/libjx/code/*; do
          ln -sf "../../libjx/code/$(basename "$f")" "Libraries/JX/include/jx/$(basename "$f")"
        done
        for f in Libraries/JX/libjcore/code/*; do
          ln -sf "../../libjcore/code/$(basename "$f")" "Libraries/JX/include/jcore/$(basename "$f")"
        done
        for f in Libraries/JX/libjx/image/*; do
          ln -sf "../../libjx/image/$(basename "$f")" "Libraries/JX/include/jximage/$(basename "$f")"
        done
        ln -sf config-linux.h Libraries/JX/ACE/ACE_wrappers/ace/config.h
        ln -sf ../include/make/sys/Linux-Intel-x86_64-gcc3 Libraries/JX/include/make/jx_config

    - name: Run PVS-Studio analysis
      if: steps.check-creds.outputs.skip != 'true'
      run: |
        pvs-studio-analyzer analyze -f compile_commands.json -j \
          -e Libraries/JX/ \
          -e Libraries/vendor/ \
          -e Libraries/vzic/ \
          -e Libraries/include/ \
          -e Libraries/openssl/

    - name: Convert results to SARIF
      if: steps.check-creds.outputs.skip != 'true'
      run: |
        plog-converter PVS-Studio.log \
          -t json -n relative -R toRelative -r "$PWD"
        plog-converter relative.json \
          -t sarif -n pvs-report -r file://

    - name: Upload SARIF to GitHub Security
      if: steps.check-creds.outputs.skip != 'true'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: pvs-report.sarif
        category: PVS-Studio
      continue-on-error: true

  # ============================================================
  # SonarCloud: technical debt and quality tracking
  # ============================================================
  sonarcloud:
    name: Analyze (SonarCloud)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Download compilation database
      uses: actions/download-artifact@v8
      with:
        name: compilation-database

    - name: Normalize compilation database paths
      run: |
        python3 -c "
        import json, os
        db = json.load(open('compile_commands.json'))
        changed = 0
        for entry in db:
            d = entry.get('directory', '')
            f = entry.get('file', '')
            resolved = os.path.normpath(os.path.join(d, f))
            if resolved != f:
                changed += 1
                entry['file'] = resolved
            if d:
                entry['directory'] = os.path.normpath(d)
        json.dump(db, open('compile_commands.json', 'w'), indent=2)
        print(f'Normalized {len(db)} entries ({changed} paths resolved)')
        "

    - name: SonarCloud scan
      uses: SonarSource/sonarqube-scan-action@v8
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          --define sonar.cfamily.compile-commands=compile_commands.json

    - name: Export SonarCloud issues to SARIF
      if: success()
      run: python3 scripts/sonarcloud-to-sarif.py
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Upload SonarCloud SARIF
      if: success()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: sonarcloud.sarif
        category: sonarcloud

  # ============================================================
  # OSV-Scanner: dependency CVE scanning (git submodules)
  # ============================================================
  osv-scanner:
    name: Dependency CVE Scan (OSV)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: "-r ./ --allow-no-lockfiles"
      checkout-submodules: true
      fail-on-vuln: false
