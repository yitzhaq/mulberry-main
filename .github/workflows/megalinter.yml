name: "MegaLinter"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  megalinter:
    name: Analyze (cppcheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    - name: MegaLinter
      uses: oxsecurity/megalinter/flavors/c_cpp@v8
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: megalinter-reports
        path: |
          megalinter-reports/
          mega-linter.log
