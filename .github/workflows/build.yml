name: "Build"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential autoconf \
          libaspell-dev libbrotli-dev libfl-dev libfontconfig-dev \
          libfreetype-dev libglib2.0-dev libkrb5-dev libldap-dev \
          libpcre3-dev libsodium-dev libssl-dev libunistring-dev libxml2-dev \
          libx11-dev libxext-dev libxft-dev libxpm-dev libzstd-dev \
          pkg-config python3 unicode-cldr-core zlib1g-dev

    - name: Configure
      run: |
        autoconf
        ./configure

    - name: Build
      run: make -j$(nproc)

  analyze:
    name: Static Analysis (GCC -fanalyzer)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential autoconf \
          libaspell-dev libbrotli-dev libfl-dev libfontconfig-dev \
          libfreetype-dev libglib2.0-dev libkrb5-dev libldap-dev \
          libpcre3-dev libsodium-dev libssl-dev libunistring-dev libxml2-dev \
          libx11-dev libxext-dev libxft-dev libxpm-dev libzstd-dev \
          pkg-config python3 unicode-cldr-core zlib1g-dev

    - name: Configure with -fanalyzer
      run: |
        autoconf
        CFLAGS="-g -O2 -fanalyzer" CXXFLAGS="-g -O2 -fanalyzer" ./configure

    - name: Build and capture warnings
      run: make -j$(nproc) 2>&1 | tee build-fanalyzer.log

    - name: Extract analyzer warnings
      if: always()
      run: grep -E '\[-Wanalyzer-' build-fanalyzer.log > fanalyzer-warnings.txt || true

    - name: Summarize findings
      if: always()
      run: |
        count=$(wc -l < fanalyzer-warnings.txt)
        echo "### GCC -fanalyzer: $count warning(s)" >> $GITHUB_STEP_SUMMARY
        if [ "$count" -gt 0 ]; then
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -50 fanalyzer-warnings.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "$count" -gt 50 ]; then
            echo "_... and $((count - 50)) more (see artifact)_" >> $GITHUB_STEP_SUMMARY
          fi
        fi

    - name: Upload analyzer results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: fanalyzer-warnings
        path: fanalyzer-warnings.txt
