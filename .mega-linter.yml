ENABLE_LINTERS:
  - C_CPPCHECK
  - CPP_CPPCHECK

DISABLE_ERRORS_LINTERS:
  - C_CPPCHECK
  - CPP_CPPCHECK

APPLY_FIXES: none
SHOW_ELAPSED_TIME: true
SARIF_REPORTER: true

# Mulberry uses .cp as the primary C++ extension
CPP_FILTER_REGEX_INCLUDE: '\.(cpp|cp|cxx|cc|hpp|hxx|h)$'
C_FILTER_REGEX_INCLUDE: '\.(c|h)$'

# Exclude third-party libraries and non-Linux platform code (no compilation database)
FILTER_REGEX_EXCLUDE: 'Libraries/(JX|open-powerplant|MoreFiles|MoreFilesX|vendor|vzic|include)/|MacOS/|Win32/'

CPP_CPPCHECK_ARGUMENTS: '--enable=all --suppress=missingIncludeSystem --suppress=missingInclude --language=c++'
C_CPPCHECK_ARGUMENTS: '--enable=all --suppress=missingIncludeSystem --suppress=missingInclude'
